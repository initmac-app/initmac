name: Catalog check
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday
  pull_request:
    paths: ["catalog/**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trust the taps the catalog allows
        run: brew tap hashicorp/tap
      - name: Check every app still exists in Homebrew
        run: python3 tools/check_brew_tokens.py | tee result.txt
      - name: Open an issue if the weekly check fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Weekly catalog check failed ($(date +%F))" \
            --body "Some apps in the catalog no longer resolve in Homebrew (renamed or removed?):

          \`\`\`
          $(grep -v '^ok' result.txt)
          \`\`\`"
